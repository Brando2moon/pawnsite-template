<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="dashboard"><aside><h2>Northline Admin</h2><button data-view="inventory">Inventory</button><button data-view="quotes">Kiosk quotes</button><a href="kiosk.html">Open kiosk</a><button data-signout>Sign out</button></aside><main><div class="dash-head"><div><span class="eyebrow">Staff dashboard</span><h1>Inventory manager</h1></div><button class="btn primary" data-new>Add product</button></div><section class="admin-grid"><form class="editor" data-editor><input name="id" type="hidden"><label>Product name<input name="name" required></label><label>Category<select name="category"><option>Jewelry</option><option>Gaming</option><option>Electronics</option><option>Tools</option><option>Music</option><option>Firearms</option></select></label><label>Price<input name="price" type="number" min="0" step="0.01" required></label><label>Condition<input name="condition" required></label><label>Status<select name="status"><option value="available">Available</option><option value="reserved">Reserved</option><option value="sold">Sold</option><option value="archived">Archived</option></select></label><label>Description<textarea name="description" rows="5" required></textarea></label><label>Photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img class="preview" data-preview alt="Photo preview"><button class="btn primary" type="submit">Save product</button><p data-editor-status></p></form><section><div class="table-wrap"><table><thead><tr><th>Item</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody data-admin-products></tbody></table></div></section></section></main></div><script src="config.js"></script><script src="admin.js"></script></body></html>
