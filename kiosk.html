<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In-Store Build Kiosk</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="kiosk"><header><strong>Northline Special-Order Builder</strong><button data-kiosk-exit>Staff exit</button></header><main><section class="builder"><div><span class="eyebrow">Step 1</span><h1>Choose a platform</h1><select data-platform><option value="">Select</option><option value="ar15">AR-style platform</option><option value="pistol">Pistol platform</option><option value="shotgun">Shotgun platform</option></select></div><div><span class="eyebrow">Step 2</span><h2>Compatible components</h2><div data-compatible></div><label class="toggle"><input type="checkbox" data-show-all> Show all catalog parts</label><p class="warning" data-warning hidden>Unverified combinations require staff compatibility review.</p></div><div><span class="eyebrow">Step 3</span><h2>Customer information</h2><form data-quote><label>Full name<input name="name" required></label><label>Phone<input name="phone" type="tel" required></label><label>Email<input name="email" type="email" required></label><label>Notes<textarea name="notes"></textarea></label><button class="btn primary" type="submit">Submit build quote</button><p data-quote-status></p></form></div></section></main><script src="config.js"></script><script src="kiosk.js"></script></body></html>
